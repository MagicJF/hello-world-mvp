<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola mundo, MVP</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #0f1115;
    --tarjeta: #171a21;
    --texto: #f2f4f8;
    --suave: #9aa4b2;
    --acento: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--tarjeta);
    border: 1px solid #262b35;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
  }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.02em; }
  p { margin: 0 0 24px; color: var(--suave); }
  button {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--acento);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: #3d7bf0; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #saludo {
    margin: 20px 0 0;
    min-height: 24px;
    font-weight: 600;
    color: var(--texto);
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <main>
    <h1>¡Hola, mundo!</h1>
    <p>Página MVP en un solo archivo. Ábrela con doble clic, sin servidor.</p>
    <button id="boton" type="button">Saludar</button>
    <p id="saludo" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var saludo = document.getElementById("saludo");
      var boton = document.getElementById("boton");
      var veces = 0;

      boton.addEventListener("click", function () {
        veces += 1;
        var hora = new Date().toLocaleTimeString("es-ES");
        saludo.textContent = veces === 1
          ? "Hola desde tu navegador, a las " + hora + "."
          : "Hola otra vez (" + veces + " veces), a las " + hora + ".";
      });
    })();
  </script>
</body>
</html>
